# LoopX owns Goal, Todo, quota, and thread-binding authority.
- insert:
    # The package-root Host row is also the discovery anchor for dsh.client.
    - id: loopx-goalbar
      name: '@xiangsam/dsh-loopx-plugin'

    - id: loopx-init-command
      name: '@xiangsam/dsh-loopx-plugin/init-command'

    - id: loopx-driver
      name: '@xiangsam/dsh-loopx-plugin/driver'

# The browser must not advertise readiness while first-run skill bootstrap is
# still in flight. A safe bootstrap failure also publishes the service, so DSH
# remains usable and /loopx-init can repair it.
- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  inject: [webStartup, loopxBootstrap]

- id: web-runtime
  name: '@deepseek-ai/dsh-web-app'
  inject: [webStartup, loopxBootstrap]

# connection.rpc.handle() scopes its channel route to the connection plugin's
# own context. dsh >= 0.1.5-alpha no longer injects webServer into the
# connection module (it injects credentials instead), so the GoalBar /loopx
# channel must restore that inject at the row level; dsh 0.1.1-rc.x already
# carried it in the module, where this row-level add is a harmless duplicate.
- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  inject: [webRuntime, webServer]
